<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{modpack.meta.title}}</title>
<meta name="description" content="{{modpack.meta.description}}">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="{{site}}modpack/">
<link rel="alternate" hreflang="ru" href="{{site}}ru/modpack/">
<link rel="alternate" hreflang="x-default" href="{{site}}modpack/">
<meta property="og:type" content="article">
<meta property="og:title" content="{{modpack.meta.title}}">
<meta property="og:description" content="{{modpack.meta.description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{site}}assets/og.png">
<meta property="og:locale" content="{{meta.locale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0f12">
<link rel="icon" href="{{root}}assets/favicon.png" type="image/png">
<link rel="preload" href="{{root}}assets/fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<style>{{css}}</style>
</head>
<body class="modpack">
<a class="skip" href="#main">{{nav.skip}}</a>
<header class="bar">
  <a class="mark" href="{{root}}{{langPath}}" aria-label="Prompt Critical">PROMPT <span>CRITICAL</span></a>
  <nav aria-label="{{nav.label}}">
    <ul>
      <li><a href="{{root}}{{langPath}}">{{modpack.nav.home}}</a></li>
      <li><a href="#earth">I0–I4</a></li>
      <li><a href="#space">I5–I8</a></li>
      <li><a href="{{root}}{{langPath}}guide/">{{nav.guide}}</a></li>
    </ul>
  </nav>
  <div class="bar-end">
    <a class="lang" href="{{otherUrl}}" hreflang="{{otherLang}}" lang="{{otherLang}}">{{nav.other}}</a>
    <a class="gh" href="https://github.com/denfry/Prompt_Critical">GitHub</a>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="foot">
  <p>{{foot.license}}</p>
  <p>{{foot.notAffiliated}}</p>
</footer>
</body>
</html>
