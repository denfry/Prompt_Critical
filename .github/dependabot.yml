version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      test-and-tooling:
        patterns: ["*junit*", "*jqwik*", "*archunit*", "*assertj*", "*jmh*"]
