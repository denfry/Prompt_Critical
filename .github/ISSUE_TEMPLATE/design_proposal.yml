name: Design proposal
description: Suggest a mechanic, a design change or a balance tweak.
labels: [design, needs-triage]
body:
  - type: input
    id: section
    attributes:
      label: Wiki page
      description: Which part of the design this touches, if any.
      placeholder: Reactor Physics
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change and how it plays in game.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why. Real-world references (standards, handbooks, plant data) are welcome.
    validations:
      required: true
  - type: checkboxes
    id: pillars
    attributes:
      label: Design pillars
      description: See the Overview and Design Pillars wiki page.
      options:
        - label: The proposal keeps physics over magic numbers (P1) and links to other industries where relevant (P7).
